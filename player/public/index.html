<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CMS Player</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="pairing-screen" class="screen hidden">
    <div class="pairing-card">
      <img id="pairing-logo" src="/static/logo.png" alt="Logo" class="brand-logo" />
      <div class="pairing-label">Registrierungs-PIN</div>
      <div id="pin" class="pin">------</div>
      <div class="pairing-hint">
        Im CMS unter <strong>Mandant &rarr; Ger&auml;te &rarr; PIN eingeben</strong> registrieren.
      </div>
      <div id="pairing-tenant" class="pairing-tenant"></div>
    </div>
  </div>

  <div id="paired-screen" class="screen hidden">
    <div class="pairing-card">
      <svg class="success-check" viewBox="0 0 52 52">
        <circle class="success-check-circle" cx="26" cy="26" r="24" fill="none" />
        <path class="success-check-mark" fill="none" d="M14 27l7 7 16-16" />
      </svg>
      <div class="pairing-label">Erfolgreich verbunden</div>
      <div id="paired-tenant" class="pairing-tenant"></div>
    </div>
  </div>

  <div id="empty-screen" class="screen hidden">
    <div class="pairing-card">
      <img id="empty-logo" src="/static/logo.png" alt="Logo" class="brand-logo brand-logo-pulse" />
      <div class="pairing-label">Keine Playlist zugewiesen</div>
      <div id="empty-tenant" class="pairing-tenant"></div>
    </div>
  </div>

  <div id="error-screen" class="screen hidden">
    <div class="pairing-card">
      <div class="pairing-label">Verbindungsfehler</div>
      <div id="error-message" class="pairing-hint"></div>
    </div>
  </div>

  <div id="deactivated-screen" class="screen hidden">
    <div class="pairing-card pairing-card-warning">
      <div class="pairing-label">Mandant deaktiviert</div>
      <div class="pairing-hint">Dieses System ist derzeit gesperrt.</div>
      <div id="deactivated-reason" class="pairing-tenant"></div>
    </div>
  </div>

  <div id="player-screen" class="screen hidden">
    <img id="media-image" class="media" />
    <video id="media-video" class="media" muted playsinline></video>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
