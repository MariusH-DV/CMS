server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx' Standardlimit fuer Request-Bodies ist nur 1 MB - reicht nicht
    # einmal fuer ein einzelnes Foto, geschweige denn fuer Videos/Audio.
    # Grosszuegig fuer Playlist-Medien (Bilder, MP3, MP4) hochgesetzt.
    client_max_body_size 1024m;

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
