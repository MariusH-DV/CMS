version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms
      POSTGRES_DB: cms
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cms']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgresql://cms:cms@postgres:5432/cms?schema=public'
      JWT_SECRET: 'change-me-to-a-long-random-secret'
      JWT_EXPIRES_IN: '8h'
      PORT: 3000
      CORS_ORIGIN: 'http://localhost:5173'
      PUBLIC_API_URL: 'http://localhost:3000/api'
      STORAGE_ROOT: '/data/tenants'
      BOOTSTRAP_ADMIN_EMAIL: 'admin@example.com'
      BOOTSTRAP_ADMIN_PASSWORD: 'ChangeMe123!'
      REPO_ROOT: '/repo'
    volumes:
      - tenant_storage:/data/tenants
      - .:/repo:ro
    ports:
      - '3000:3000'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  postgres_data:
  tenant_storage:
